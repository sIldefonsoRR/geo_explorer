<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geo Explorer</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <h1 id="app-title">Geo Explorer</h1>
      <label id="country-names-toggle">
        <input id="show-country-names" type="checkbox" />
        Show country names
      </label>
      <div id="search-panel">
        <input
          id="search-input"
          type="text"
          placeholder="Search a city or country..."
          autocomplete="off"
        />
        <ul id="search-results"></ul>
      </div>
      <!-- prerender:start (generated by scripts/prerender.mjs, do not edit by hand) -->
      <section id="prerendered-content" class="visually-hidden"></section>
      <!-- prerender:end -->
    </div>
    <noscript>
      <main>
        <h1>Geo Explorer — Interactive World Map</h1>
        <p>
          Geo Explorer lets you search any city or country and view its
          location, population, and coordinates on a world map, along with
          country border outlines. Data covers world countries and their
          largest cities.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
