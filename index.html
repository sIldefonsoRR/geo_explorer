        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Geo Explorer",
        "url": "https://geo-explorer-mu.vercel.app/",
        "description": "Interactive world map for searching cities and countries, viewing country boundaries, and looking up population and coordinates.",
        "applicationCategory": "MapApplication",

    <div id="app">
      <div id="map"></div>
      <h1 id="app-title">Geo Explorer</h1>
      <label id="country-names-toggle">
        <input id="show-country-names" type="checkbox" />

      </label>
      <div id="search-panel">
        <input
          id="search-input"
          type="text"
          placeholder="Search a city or country..."
          autocomplete="off"
        />
        <ul id="search-results"></ul>
      </div>
      <!-- prerender:start (generated by scripts/prerender.mjs, do not edit by hand) -->

      <!-- prerender:end -->
    </div>
    <noscript>
      <main>
        <h1>Geo Explorer — Interactive World Map</h1>
        <p>
          Geo Explorer lets you search any city or country and view its
          location, population, and coordinates on a world map, along with
          country border outlines. Data covers world countries and their
          largest cities.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
